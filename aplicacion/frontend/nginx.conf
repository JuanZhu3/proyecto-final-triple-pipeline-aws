server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Nota: nginx no hereda los add_header del server en un location que
    # declare los suyos, por eso las cabeceras de seguridad se repiten.

    # Health check del target group del ALB
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
