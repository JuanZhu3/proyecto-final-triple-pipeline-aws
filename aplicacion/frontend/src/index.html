<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de tareas · Proyecto Final DevOps</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Lista de tareas</h1>
      <p class="sub">Subtitulo de muestra no se que</p>
    </header>

    <section class="estado" aria-live="polite">
      <div><span class="etq">Frontend</span> <span id="ver-front">…</span></div>
      <div><span class="etq">Backend</span> <span id="estado-api" class="pend">comprobando…</span></div>
    </section>

    <form id="form-nueva">
      <input id="titulo" name="titulo" maxlength="200" placeholder="Nueva tarea…" autocomplete="off" required>
      <button type="submit">Agregar</button>
    </form>
    <p id="error" class="error" hidden></p>

    <ul id="lista"></ul>
    <p id="vacio" class="vacio" hidden>No hay tareas todavía.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
