# Ejecución local: reproduce el enrutamiento del ALB con un proxy nginx.
#   docker compose up --build   →   http://localhost:8000
services:
  backend:
    build: ./backend
    environment:
      APP_VERSION: local
  frontend:
    build: ./frontend
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./local/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
